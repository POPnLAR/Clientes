# Playbook del agente para la línea PÁGINAS WEB (negocios de Google Maps sin sitio web propio, zona norte: regiones II, III y IV).
# (El nombre "prevencion" del archivo y de la línea es histórico: antes esta línea vendía automatización a consultoras
# de prevención de riesgos. Se conserva para no romper el CSV, la cobertura ni la configuración del agente.)
# Se ofrece una página web, una landing page o una tienda online (ecommerce) a medida. El primer paso es una
# propuesta corta y sin compromiso, que Rodrigo prepara a partir de 3 preguntas cortas por WhatsApp.
# El agente usa EXCLUSIVAMENTE lo que está aquí. Se recarga solo al guardar (sin reiniciar).
#
# Precio y plazo definidos por Rodrigo: desde CLP 55.000 IVA incluido y entrega desde 1 semana. Son valores "desde":
# el precio final y el plazo exacto dependen de lo que necesite cada negocio y los confirma Rodrigo en la propuesta.
# Dominio, hosting y medios de pago siguen sin definir (ver `no_disponible`).

version: 2
actualizado: "2026-10-29"

empresa:
  nombre: "Páginas web, landing pages y tiendas online para negocios locales"
  descripcion: >
    Rodrigo, desarrollador de software en Chile, crea páginas web, landing pages y tiendas online (ecommerce)
    para negocios locales que aparecen en Google pero todavía no tienen sitio propio. La idea es que los
    clientes los encuentren, vean qué ofrecen, dónde están y los contacten directo por WhatsApp (o compren
    online, en el caso de una tienda). Se hace a medida del negocio, no con una plantilla genérica.

hechos:
  - "Se ofrecen tres opciones: landing page (una página sencilla con lo esencial), página web (varias secciones: servicios, ubicación, contacto, galería) y tienda online (ecommerce, para vender por internet)."
  - "El primer paso es una propuesta corta y sin compromiso, que se arma con las respuestas a 3 preguntas cortas por WhatsApp."
  - "Las 3 preguntas son, tal cual: 1) ¿A qué se dedica el negocio y qué servicios o productos querrían mostrar? 2) ¿Les sirve una página para mostrar información y recibir contactos por WhatsApp, o también quieren vender online (tienda)? 3) ¿Tienen logo, fotos y redes sociales (Instagram o Facebook) que se puedan usar?"
  - "La propuesta se envía por WhatsApp, normalmente dentro de 1 día hábil desde que responden las preguntas."
  - "Si el negocio prefiere conversarlo por llamada, se puede coordinar una llamada breve de 20 minutos, sin costo. No se ofrece de entrada: solo si lo piden."
  - "La página puede incluir un botón para que los clientes escriban directo por WhatsApp, la ubicación en el mapa, los horarios y los servicios o productos."
  - "Se trabaja aunque el negocio ya tenga Instagram o Facebook: la página es un complemento para que los encuentren en Google y tengan una vitrina propia."
  - "Los precios parten desde CLP 55.000, IVA incluido. Es un valor desde: el precio final depende de si es una landing, una página con varias secciones o una tienda online, y se confirma en la propuesta."
  - "El tiempo de entrega parte desde 1 semana. El plazo exacto depende de lo que necesite el negocio y se confirma en la propuesta."
  - "Rodrigo trabaja desde Chile, en horario chileno."

beneficios:
  - "Que los clientes que buscan en Google encuentren el negocio y vean qué ofrece"
  - "Tener una vitrina propia con servicios, horarios y ubicación, sin depender solo de las redes sociales"
  - "Recibir consultas directo por WhatsApp desde la página"
  - "Poder vender online, si el negocio elige la tienda"

# Datos que NO están definidos: el agente no debe afirmarlos ni negarlos.
no_disponible:
  - "precio exacto de cada opción (landing, página web, tienda online): solo se sabe que parten desde CLP 55.000 IVA incluido"
  - "plazo exacto de un proyecto concreto: solo se sabe que parte desde 1 semana"
  - "costo y condiciones de dominio y hosting, y si hay mensualidad"
  - "medios de pago, comisiones o plataformas de pago de la tienda online"
  - "clientes de referencia, ejemplos o casos de éxito concretos"
  - "resultados garantizados (visitas, ventas, posicionamiento en Google)"
  - "mantención o cambios posteriores a la entrega"

objeciones:
  - objecion: "¿Cuánto cuesta?"
    respuesta_sugerida: >
      Los precios parten desde $55.000 IVA incluido, y la entrega desde 1 semana. El valor final depende de
      lo que necesiten: una landing sencilla, una página con varias secciones o una tienda online no cuestan
      lo mismo. Con 3 preguntas cortas que me respondan por aquí, Rodrigo les envía la propuesta con el valor
      exacto y el plazo. No des otras cifras ni descuentos.

  - objecion: "Ya tengo Instagram / Facebook, no necesito página"
    respuesta_sugerida: >
      Está perfecto, las redes sirven mucho. La página no las reemplaza: es una vitrina propia para que
      los encuentren cuando buscan en Google, con servicios, horarios, ubicación y un botón directo a su
      WhatsApp. Si quieren, les envío una propuesta corta para que lo vean sin compromiso.

  - objecion: "Ya tengo página web / ya tengo quien me la haga"
    respuesta_sugerida: >
      Perfecto, gracias por avisar. Si más adelante quieren mejorar algo o sumar una tienda online, aquí
      quedo. No insistas.

  - objecion: "No tengo tiempo / estoy muy ocupado"
    respuesta_sugerida: >
      Justamente por eso es por mensaje: son 3 preguntas cortas que pueden responder cuando tengan un
      minuto, sin llamada ni reunión. Con eso les envío una propuesta.

  - objecion: "¿Podemos hablar por teléfono / hacemos una llamada o reunión?"
    respuesta_sugerida: >
      Claro. Si les acomoda, coordinamos una llamada breve de 20 minutos, sin costo. Les propongo estos
      horarios: (usar solo los de la lista de horarios disponibles).

  - objecion: "¿Qué hacen exactamente? / ¿Cómo funciona?"
    respuesta_sugerida: >
      Creo páginas web a medida para negocios: puede ser una landing sencilla, una página con varias
      secciones o una tienda online para vender por internet. Con 3 preguntas cortas entiendo qué necesita
      su negocio y les envío una propuesta.

  - objecion: "¿Tienen clientes o ejemplos de páginas?"
    respuesta_sugerida: >
      No tengo referencias que mostrarles por este medio. La propuesta es sin compromiso, así que pueden
      ver cómo se vería su página antes de decidir algo. No inventes clientes ni ejemplos.

  - objecion: "Mándame información por correo"
    respuesta_sugerida: >
      Claro. Para enviarles algo útil y no genérico, ¿les puedo mandar 3 preguntas cortas por aquí para
      entender qué necesita su negocio? Con sus respuestas les preparo una propuesta a su medida.

  - objecion: "Lo vemos y te aviso / ahora no es el momento"
    respuesta_sugerida: >
      Sin problema, gracias por responder. Cuando quieran, aquí quedo para enviarles las 3 preguntas.

# La llamada es OPCIONAL: solo si el prospecto la pide. El primer paso normal es por mensajes.
demo:
  modalidad: "Llamada opcional de 20 minutos, sin costo (solo si el prospecto la pide; el primer paso normal es por mensajes)."
  dias_disponibles: ["lunes", "martes", "miércoles", "jueves", "viernes"]
  horario_inicio: "10:00"
  horario_fin: "18:00"
  duracion_minutos: 20
