# Playbook del agente para la línea ALMACENES (GestiónAlmacén Pro).
# Es un producto distinto de GestiónVital Pro (clínicas): tiene su propio nombre, sitio y plan.
# El agente usa EXCLUSIVAMENTE lo que está aquí. Se recarga solo al guardar (sin reiniciar).
#
# Fuente: página oficial https://gestionalmacenpro.cl/ (revisada el 2026-09-23) y lo indicado por
# Rodrigo: un único plan de $37.000 mensuales. Lo que la página no confirma está en `no_disponible`:
# el agente no lo afirma y lo deriva a una demo con Rodrigo. Si lo defines, muévelo a `hechos`.

version: 2
actualizado: "2026-09-23"

empresa:
  nombre: "GestiónAlmacén Pro"
  sitio_web: "https://gestionalmacenpro.cl"
  descripcion: >
    Sistema de punto de venta (POS) chileno para almacenes, minimarkets y botillerías de barrio:
    convierte el celular en un punto de venta profesional para vender, controlar el stock y llevar
    la caja.
  trial_dias: 7
  registro_trial: "https://app.gestionalmacenpro.cl"
  sin_contrato_permanencia: true

hechos:
  - "El celular hace de punto de venta: no se necesita equipamiento especial."
  - "Escáner móvil: se usa la cámara del celular para registrar productos."
  - "Integración oficial con las máquinas Point Smart 2 de Mercado Pago."
  - "Caja y finanzas: registra los pagos en efectivo con redondeo automático según la ley chilena."
  - "Control de stock para mantener el inventario cuadrado."
  - "Gestión remota: se puede revisar el estado del negocio a distancia."
  - "Ventas ilimitadas y productos ilimitados."
  - "Prueba gratis de 7 días al registrarse en https://app.gestionalmacenpro.cl, sin tarjeta de crédito."
  - "Sin contrato anual obligatorio: se cancela cuando se quiera y se paga solo por lo que se necesita."
  - "Está optimizado para almacenes, minimarkets y botillerías."

beneficios:
  - "Ver rápido cuánto se vendió en el día"
  - "Tener claro qué productos se están moviendo más"
  - "Evitar quedarse sin stock en cosas clave"
  - "Saber a tiempo qué pedir a los proveedores"
  - "Llevar la caja y las ventas desde el celular"

# Un único plan. El valor publicado no aclara si incluye IVA, por eso no se le agrega "+ IVA".
planes:
  - id: profesional
    nombre: "Plan Profesional (único plan)"
    precio_mensual_clp: 37000
    sufijo_precio: "/mes"
    nota_oferta: >-
      incluye 1 sucursal y 3 empleados; sucursal adicional $12.000 al mes y empleado adicional
      $3.500 al mes; ventas y productos ilimitados
    incluye:
      - "Punto de venta desde el celular"
      - "Escáner con la cámara del celular"
      - "Integración con Point Smart 2 de Mercado Pago"
      - "Caja y finanzas con redondeo automático"
      - "Control de stock"
      - "Gestión remota del negocio"

# Datos que la página oficial NO confirma: el agente no debe afirmarlos ni negarlos.
no_disponible:
  - "si el precio incluye IVA"
  - "migración de datos desde otro sistema"
  - "soporte técnico (canales y horarios)"
  - "fiado o crédito a clientes"
  - "gestión de proveedores"
  - "tipos de reportes disponibles"
  - "funcionamiento sin internet"
  - "uso desde computador u otros dispositivos distintos al celular"
  - "descuentos o promociones"

objeciones:
  - objecion: "¿Cuánto cuesta? / Es caro"
    respuesta_sugerida: >
      Hay un solo plan de $37.000 al mes, que incluye 1 sucursal y 3 empleados, con ventas y
      productos ilimitados y sin contrato anual: cancelas cuando quieras. Además puedes probarlo
      7 días gratis, sin tarjeta, antes de decidir.

  - objecion: "¿Puedo probarlo antes de pagar?"
    respuesta_sugerida: >
      Sí, tienes 7 días gratis registrándote en https://app.gestionalmacenpro.cl, sin tarjeta de
      crédito. Si prefieres, te lo muestro yo en una demo corta por WhatsApp.

  - objecion: "¿Tiene contrato o permanencia?"
    respuesta_sugerida: >
      No exigimos contratos anuales obligatorios: cancelas cuando quieras y pagas solo por lo que
      necesitas.

  - objecion: "¿Necesito comprar equipos o algo especial?"
    respuesta_sugerida: >
      No, funciona con tu celular: hasta la cámara sirve de escáner para registrar los productos.
      Si ya usas una máquina Point Smart 2 de Mercado Pago, hay integración oficial.

  - objecion: "¿Sirve para mi tipo de negocio?"
    respuesta_sugerida: >
      Está pensado justamente para almacenes, minimarkets y botillerías de barrio.

  - objecion: "Ya llevo las cuentas en un cuaderno, en Excel o de memoria"
    respuesta_sugerida: >
      Es lo más común en los almacenes. La idea es ahorrarte ese trabajo: vendes desde el celular
      y ves qué se vendió y qué se está moviendo más, sin cuaderno. Si quieres te lo muestro en
      una demo corta por WhatsApp.

  - objecion: "Ya tengo un sistema o alguien que me lleva eso"
    respuesta_sugerida: >
      Perfecto, gracias por contarme. No es para cambiar nada de un día para otro: si en algún
      momento quieres comparar, tienes 7 días gratis para probarlo o te lo muestro en una demo
      corta, y decides tú.

  - objecion: "Lo vemos y te aviso / ahora no tengo tiempo"
    respuesta_sugerida: >
      Sin problema, gracias por responder. Cuando quieras, aquí quedo para mostrarte cómo
      funciona en una demo corta por WhatsApp.

demo:
  modalidad: "Demo corta guiada por WhatsApp, con acceso real al sistema."
  duracion_minutos: 10
