name: GestionVital Pro Cron

on:
  schedule:
    # Corre cada hora, en el minuto 15. La ventana de envío real la controla
    # worker.py (lunes a sábado, 9:00-18:59 hora Chile, obtener_ahora_chile() ya es DST-aware; se ajusta con HORA_INICIO_ENVIO/HORA_FIN_ENVIO).
    # Antes corría cada 2 horas con un cron fijo en UTC: cuando Chile cambia de
    # horario de verano/invierno, ese horario fijo se desalinea ~1h con la
    # ventana de Chile, y GitHub retrasa bastante los cron jobs en :00/:15
    # (horas más congestionadas) — la combinación dejaba la primera corrida
    # útil del día cayendo bien pasado el mediodía. Correr cada hora da
    # margen de sobra para absorber ambos problemas sin depender de ajustar
    # el cron dos veces al año.
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Vital para que el rebase funcione

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: pip install pandas requests fpdf beautifulsoup4 lxml tzdata

      - name: Configurar Git
        run: |
          git config --global user.name 'GestionVital Bot'
          git config --global user.email 'bot@gestionvitalpro.cl'
          git config --global pull.rebase true

      - name: Sincronizar con Streamlit (Antes de ejecutar)
        run: |
          git pull origin main

      - name: Ejecutar Prospeccion
        env:
          EVO_URL: ${{ secrets.EVO_URL }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          EVO_INSTANCE: ${{ secrets.EVO_INSTANCE }}
          SERP_KEY: ${{ secrets.SERP_KEY }}
          AGENT_SERVICE_URL: ${{ secrets.AGENT_SERVICE_URL }}
          AGENT_SERVICE_TOKEN: ${{ secrets.AGENT_SERVICE_TOKEN }}
          NUMERO_OPERADOR: ${{ secrets.NUMERO_OPERADOR }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python worker.py

      - name: Guardar y Sincronizar cambios (Post-Ejecución)
        run: |
          # 1. Agregamos los cambios generados por el worker (leads, alerta,
          # y el estado persistente del barrido exhaustivo + presupuesto SerpAPI).
          # Se agregan uno por uno y solo si existen: si a "git add" se le pasan
          # varios archivos y UNO no existe (ej. alert_status.json, que solo se
          # crea si hubo una alerta este ciclo), aborta el comando COMPLETO sin
          # agregar ninguno — por eso no se pueden agregar todos en una sola línea.
          for f in prospeccion_gestionvital_pro.csv alert_status.json cobertura_clinicas.json presupuesto_serpapi.json; do
            [ -f "$f" ] && git add "$f"
          done
          
          # 2. Verificamos si hay cambios reales para commitear
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Actualizacion leads [Skip CI]"
            
            # 3. Intentamos subir. 
            # Usamos -X theirs para que, en caso de conflicto, los cambios del commit actual (Worker)
            # prevalezcan sobre los que están en el repositorio (Streamlit).
            git pull origin main --rebase -X theirs
            
            # 4. Empujar los cambios limpios
            git push origin main
          else
            echo "No hay cambios para actualizar."
          fi
