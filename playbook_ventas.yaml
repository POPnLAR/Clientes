# Playbook de ventas de GestiónVital Pro.
# Esta es la ÚNICA fuente de verdad sobre precios, planes y promociones que
# usa el agente conversacional (ver gemini_client.py). Editar este archivo NO
# requiere reiniciar el servicio: se recarga solo cuando cambia su fecha de
# modificación.
#
# Para modificar precios o promos: edita los valores de abajo y guarda. Para
# agregar una objeción nueva, copia un bloque de "objeciones" y complétalo.

version: 1
actualizado: "2026-09-21"

empresa:
  nombre: "GestiónVital Pro"
  registro_trial: "https://app.gestionvitalpro.cl/registro"
  trial_dias: 14
  sin_contrato_permanencia: true
  migracion_datos_gratis: true

planes:
  - id: basico
    nombre: "Plan Básico"
    precio_mensual_clp: 70000
    incluye:
      - "Agenda de Citas"
      - "Fichas de Pacientes"
      - "Soporte por Ticket"

  - id: medio
    nombre: "Plan Medio"
    precio_mensual_clp: 170000
    incluye:
      - "Todo lo del Plan Básico"
      - "Catálogo de Servicios"
      - "Gestión de Profesionales"
      - "Evolución Clínica y Fotos"
      - "Consentimientos Digitales"
      - "Promociones y Descuentos"
      - "Reportes y Estadísticas"
      - "Encuestas de Satisfacción"

  - id: avanzado
    nombre: "Plan Avanzado"
    precio_mensual_clp: 170000
    precio_lista_clp: 320000
    nota_oferta: "Oferta actual: el Plan Avanzado completo al precio del Plan Medio"
    incluye:
      - "Todo lo del Plan Medio"
      - "Inventario Completo de Insumos"
      - "Anulación de Cobros"
      - "Reporte de Carritos Abandonados"
      - "Reporte de Recompra de Pacientes"

  - id: ecommerce_addon
    nombre: "Ecommerce (complemento, se suma a cualquier plan)"
    precio_mensual_clp: 35000
    incluye:
      - "Agenda Online"
      - "Panel de Atención"
      - "Notificación de Carrito Abandonado"
      - "Pagos en Línea con Flow"

promociones:
  - id: combo_basico_ecommerce
    nombre: "Combo Básico + Ecommerce"
    precio_mensual_clp: 80000
    condiciones: "Recomendado para empresas/centros pequeños que están comenzando."

  - id: avanzado_precio_medio
    nombre: "Plan Avanzado a precio de Plan Medio"
    precio_mensual_clp: 170000
    condiciones: "El plan completo (incluye inventario y reportes avanzados) al precio del Plan Medio."

# Guía interna para que el agente sugiera un plan según lo que cuente el lead.
# No es una regla rígida: es una sugerencia de punto de partida para la conversación.
reglas_recomendacion:
  - condicion: "Centro pequeño, 1-2 profesionales, recién iniciando, quiere también vender online."
    plan_sugerido: combo_basico_ecommerce
  - condicion: "Centro mediano, varios servicios y profesionales, quiere fichas clínicas y fidelizar clientas."
    plan_sugerido: medio
  - condicion: "Maneja inventario de insumos, anula cobros seguido, o quiere reportes de recompra."
    plan_sugerido: avanzado_precio_medio

# Margen de negociación que el agente SÍ puede ofrecer cuando el prospecto objeta el precio.
# Cambia descuento_pct para ajustar el tope; no hay otro descuento autorizado.
negociacion:
  descuento_pct: 10
  aplica_a: "cualquier plan o promoción, sobre el precio mensual + IVA, mientras sea cliente"
  reglas:
    - "Solo se ofrece si el prospecto dice que es caro, que no le alcanza el presupuesto o pide rebaja."
    - "Primero reencuadra: valor (qué incluye) y la opción más económica que le calce (combo Básico + Ecommerce). Si sigue objetando, recién ahí ofrece el descuento."
    - "Se ofrece una sola vez y no se supera el tope. Calcula el precio con descuento sobre el precio real del plan."
    - "Si pide más rebaja que el tope, o dice que igual no puede pagarlo, no negocies más: dile que Rodrigo lo revisa directamente con él."
    - "Nunca ofrezcas el descuento a quien no lo pidió ni objetó el precio."

objeciones:
  - objecion: "Es muy caro / no tengo presupuesto para eso"
    respuesta_sugerida: >
      Entiendo la preocupación por el presupuesto. Justo para partir sin
      arriesgar tanto existe el combo Básico + Ecommerce a $80.000 + IVA al
      mes, sin contrato de permanencia, así que puedes probarlo y cancelar
      cuando quieras si no te acomoda. Si aun así se te escapa del presupuesto,
      cuéntamelo: puedo ofrecerte un 10% de descuento mensual sobre el plan que
      elijas (por ejemplo, el combo quedaría en $72.000 + IVA al mes). Si necesitas
      más que eso, Rodrigo lo ve directamente contigo.

  - objecion: "Quiero un descuento / ¿me puede hacer un mejor precio?"
    respuesta_sugerida: >
      Algo se puede hacer: te ofrezco un 10% de descuento mensual sobre el plan
      que elijas (Básico $63.000, combo Básico + Ecommerce $72.000, Medio o
      Avanzado $153.000, todos + IVA al mes), sin contrato de permanencia. Es
      el máximo que puedo darte; si necesitas algo distinto, Rodrigo lo
      conversa directamente contigo.

  - objecion: "Ya uso otra herramienta (Agenda Pro, otro software, agenda online, sistema de la clínica, etc.)"
    respuesta_sugerida: >
      Buena, entonces ya conoces el valor de tener todo ordenado. Lo que
      suma GestiónVital es que reúne en un solo sistema más que una herramienta suelta: trae fichas de pacientes,
      evolución clínica con fotos y consentimientos digitales (Plan Medio), e
      inventario de insumos, anulación de cobros y reportes de recompra (Plan
      Avanzado, hoy a $170.000 + IVA en vez de $320.000), todo en un solo
      sistema. Además migramos tus datos sin costo, no hay contrato de
      permanencia y tienes 14 días de prueba gratis para comparar. ¿Qué es lo que hoy
      sigues haciendo aparte (fichas, inventario, cobros)?

  - objecion: "Ya administro todo por Excel o cuaderno / WhatsApp"
    respuesta_sugerida: >
      Total, muchos centros parten así. La diferencia es que acá los
      recordatorios de WhatsApp y la agenda online se envían solos, así que
      dejas de perder horas por inasistencias no avisadas. Y la migración de
      tus datos actuales está incluida sin costo, no partes de cero.

  - objecion: "¿Tiene contrato de permanencia?"
    respuesta_sugerida: >
      No, ningún plan tiene contrato de permanencia — cancelas cuando
      quieras.

  - objecion: "¿Puedo probarlo antes de pagar?"
    respuesta_sugerida: >
      Sí, tienes 14 días de prueba gratis apenas te registras en
      https://app.gestionvitalpro.cl/registro, y si prefieres te muestro yo
      mismo el sistema en una demo guiada por WhatsApp antes de eso.

demo:
  dias_disponibles: ["jueves", "viernes", "sabado"]
  horario_inicio: "10:00"
  horario_fin: "19:00"
  duracion_minutos: 30
  modalidad: "Guiada por WhatsApp, con acceso real al sistema, sin instalar nada."

# Filtro de mensajes entrantes: decide qué mensajes NO llegan a Gemini (ahorra tokens).
# Todo es opcional; los valores por defecto están en filtro_mensajes.py. Se recarga solo.
filtros:
  activo: true
  ignorar_desconocidos: true   # solo responde a leads de los CSV o con quien ya hubo conversación
  responder_lid: true          # los @lid no traen teléfono (links wa.me): se responden igual
  debounce_segundos: 6         # ráfaga de mensajes seguidos -> una sola respuesta (0 = desactivar)
  max_entrantes_por_hora: 8    # más que esto de un mismo número = bot en bucle
  repetidos_max: 2             # el mismo texto más de N veces en 10 min = bot repitiendo
  # Se SUMAN a los patrones/cierres por defecto (regex sin acentos, en minúsculas):
  patrones_bot: []
  cierres: []
